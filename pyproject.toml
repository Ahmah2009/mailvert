[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailvert"
version = "2.0.0"
description = "Async email address verification service — syntax, MX, SMTP deliverability and catch-all/disposable detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahmad" }]
keywords = ["email", "verification", "smtp", "mx", "validator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Communications :: Email",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "dnspython>=2.6",
    "email-validator>=2.1",
    "slowapi>=0.1.9",
    "typer>=0.12",
    "rich>=13.7",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
mailvert = "mailvert.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mailvert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
